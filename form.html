


 <!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/20c5629a29.js" crossorigin="anonymous"></script>
    <meta charset="utf-8" />
    <title>Responsive Registration Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="form-title">Donation Form</h1>
      <form id="donationForm">
        <div class="main-user-info">
          <div class="user-input-box">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter Full Name" required />
          </div>
          <div class="user-input-box">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter Username" required />
          </div>
          <div class="user-input-box">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter Email" required />
          </div>
          <div class="user-input-box">
            <label for="phoneNumber">Phone Number</label>
            <input type="text" id="phoneNumber" name="phoneNumber" placeholder="Enter Phone Number" required />
          </div>
          <div class="user-input-box">
            <label for="orphanageName">Orphanage Name</label>
            <input type="text" id="orphanageName" name="orphanageName" placeholder="Enter Orphanage Name" required />
          </div>
          <div class="user-input-box">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Enter Address" required />
          </div>
        </div>
        <div class="gender-details-box">
          <span class="gender-title">Gender</span>
          <div class="gender-category">
            <input type="radio" name="gender" id="male" required />
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" />
            <label for="female">Female</label>
            <input type="radio" name="gender" id="other" />
            <label for="other">Other</label>
          </div>
        </div>
        <div class="form-submit-btn">
          <input id="donateButton" type="submit" value="Register" />
        </div>
          
      </form>
      <a href="second.html"><button class="btn btn-primary text-center button">Back</button></a>
    </div>

    <script>
      document.getElementById('donationForm').addEventListener('submit', function(event) {
        // Prevent form from submitting if validation fails
        event.preventDefault();
        
        // Check if all fields are filled
        const form = event.target;
        const inputs = form.querySelectorAll('input[required]');
        let isValid = true;

        // Check if all required fields are filled
        inputs.forEach(input => {
          if (!input.value) {
            isValid = false;
          }
        });

        // Check if any radio button is selected
        const genderRadios = form.querySelectorAll('input[name="gender"]');
        const genderSelected = Array.from(genderRadios).some(radio => radio.checked);

        if (!isValid || !genderSelected) {
          alert('Please fill in all fields and select a gender.');
          return;
        }

        alert('Successfully Registered');
        form.reset(); // Optionally reset the form
      });
    </script>
  </body>
</html>
